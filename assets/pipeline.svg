<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Correctness-first model optimization pipeline</title>
  <desc id="desc">Five evenly aligned stages from rule inference to audited promotion</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="#0b1728"/>
  <text x="600" y="45" fill="#8fd9e2" font-family="Segoe UI,Arial,sans-serif" font-size="17" letter-spacing="3" text-anchor="middle">CORRECTNESS FIRST · COST SECOND</text>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(35 92)"><rect width="190" height="116" rx="18" fill="#10283a" stroke="#2dd4bf" stroke-width="2"/><text x="95" y="50" fill="#fff" font-size="20" font-weight="600">INFER</text><text x="95" y="80" fill="#91b9c7" font-size="15">semantic rule</text></g>
    <g transform="translate(270 92)"><rect width="190" height="116" rx="18" fill="#10283a" stroke="#36c9c6" stroke-width="2"/><text x="95" y="50" fill="#fff" font-size="20" font-weight="600">COMPILE</text><text x="95" y="80" fill="#91b9c7" font-size="15">ONNX candidate</text></g>
    <g transform="translate(505 92)"><rect width="190" height="116" rx="18" fill="#10283a" stroke="#43bfc9" stroke-width="2"/><text x="95" y="50" fill="#fff" font-size="20" font-weight="600">FALSIFY</text><text x="95" y="80" fill="#91b9c7" font-size="15">counterexamples</text></g>
    <g transform="translate(740 92)"><rect width="190" height="116" rx="18" fill="#10283a" stroke="#51b3d1" stroke-width="2"/><text x="95" y="50" fill="#fff" font-size="20" font-weight="600">MEASURE</text><text x="95" y="80" fill="#91b9c7" font-size="15">memory + params</text></g>
    <g transform="translate(975 92)"><rect width="190" height="116" rx="18" fill="#142f47" stroke="#60a5fa" stroke-width="2"/><text x="95" y="50" fill="#fff" font-size="20" font-weight="600">PROMOTE</text><text x="95" y="80" fill="#91b9c7" font-size="15">hash + ZIP audit</text></g>
  </g>
  <g fill="#0b1728" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(247.5 150)"><circle r="14"/><path d="M-6 0H7M2-5l5 5-5 5" fill="none"/></g>
    <g transform="translate(482.5 150)"><circle r="14"/><path d="M-6 0H7M2-5l5 5-5 5" fill="none"/></g>
    <g transform="translate(717.5 150)"><circle r="14"/><path d="M-6 0H7M2-5l5 5-5 5" fill="none"/></g>
    <g transform="translate(952.5 150)"><circle r="14"/><path d="M-6 0H7M2-5l5 5-5 5" fill="none"/></g>
  </g>
  <text x="600" y="270" fill="#718fa2" font-family="Segoe UI,Arial,sans-serif" font-size="15" text-anchor="middle">A failed gate returns the candidate to the experiment log, never to the accepted baseline.</text>
</svg>
