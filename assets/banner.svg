      <g fill="#fbbf24"><rect x="45" y="135" width="40" height="40" rx="4"/><rect x="90" y="135" width="40" height="40" rx="4"/><rect x="135" y="135" width="40" height="40" rx="4"/><rect x="90" y="180" width="40" height="40" rx="4"/></g>
    </g>
